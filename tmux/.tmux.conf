# ── Terminal & colors ───────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on
set -s escape-time 0
set -g set-clipboard on

# ── Prefix ──────────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── General ─────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# ── Appearance ──────────────────────────────────────────────────
set -g status-style bg=color235,fg=color39

# ── Reload config ───────────────────────────────────────────────
bind r source-file ~/.tmux.conf

# ── Windows ─────────────────────────────────────────────────────
bind -r ^ last-window

# ── Pane navigation (vim-like, repeatable) ──────────────────────
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ── Pane resizing (repeatable: prefix once, then H/J/K/L) ───────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi) ──────────────────────────────────────────────
set-window-option -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X rectangle-off \; send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard -in 2>/dev/null || wl-copy 2>/dev/null || true"
